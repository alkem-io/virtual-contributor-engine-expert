[tool.poetry]
name = "virtual-contributor-engine-expert"
version = "0.20.0"
description = "Alkemio Generative AI Virtul Persona"
authors = ["Alkemio BV <info@alkem.io>"]
license = "EUPL-1.2"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
load-dotenv = "0.1.0"
async-timeout = "5.0.1"
aio-pika = "9.5.7"
aiormq = "6.9.0"
pydantic = "2.11.9"
alkemio-virtual-contributor-engine = {git = "https://github.com/alkem-io/virtual-contributor-engine.git", tag = "v0.8.0"}

[tool.poetry.group.dev.dependencies]
flake8 = "7.3.0"
pytest = "^8.0"
pytest-cov = "^6.0"
pytest-asyncio = "^0.24"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

